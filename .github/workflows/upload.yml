- name: Upload to Telegram
      run: |
        FILE=$(ls *.zip | head -n 1)

        curl -F document=@${FILE} \
             -F caption="UranusKernel Build Success
📦 ${FILE}
📱 Device: surya
🕒 $(date '+%Y-%m-%d %H:%M WIB')" \
             https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TG_CHAT_ID }}
