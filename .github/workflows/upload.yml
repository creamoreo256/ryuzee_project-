- name: Upload to Telegram
  if: success()
  run: |
    ZIP=$(ls *.zip | head -n 1)
    CAPTION="UranusKernel build success
📱 Device: surya
📅 Date: $(date +'%Y-%m-%d %H:%M WIB')
🔧 Clang: AOSP 13289611
📦 File: ${ZIP}"

    curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument" \
      -F chat_id="${{ secrets.TG_CHAT_ID }}" \
      -F document=@"${ZIP}" \
      -F caption="${CAPTION}"
