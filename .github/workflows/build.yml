name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set Timezone
      run: |
        sudo timedatectl set-timezone Asia/Jakarta
        echo "TZ=Asia/Jakarta" >> $GITHUB_ENV

    - name: Install build deps
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache flex \
          libssl-dev libelf-dev lld git wget unzip zip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi

    - name: Cache AOSP Clang
      uses: actions/cache@v4
      with:
        path: clang
        key: aosp-clang-13289611-${{ runner.os }}

    - name: Get AOSP Clang
      run: |
        if [ ! -d clang ]; then
          wget https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz
          mkdir clang
          tar -xf clang-13289611-linux-x86.tar.xz --strip-components=1 -C clang
        fi

    - name: Build kernel
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Pack kernel zip
      run: |
        OUT=out/arch/arm64/boot
        AK=AnyKernel3

        BUILD_DATE=$(date +%Y%m%d)
        BUILD_TIME=$(date +%H%M)
        ZIP_NAME="UranusKernel-surya-${BUILD_DATE}-${BUILD_TIME}.zip"

        cp ${OUT}/Image.gz ${AK}/Image.gz
        cp ${OUT}/dtb.img ${AK}/dtb.img
        [ -f ${OUT}/dtbo.img ] && cp ${OUT}/dtbo.img ${AK}/dtbo.img

        cd ${AK}
        zip -r9 ../${ZIP_NAME} *
        cd ..

        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

    - name: Upload to Telegram
      if: success()
      run: |
        chmod +x scripts/upload.sh
        scripts/upload.sh \
          "${ZIP_NAME}" \
          "${{ secrets.TG_BOT_TOKEN }}" \
          "${{ secrets.TG_CHAT_ID }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-zip
        path: "*.zip"
