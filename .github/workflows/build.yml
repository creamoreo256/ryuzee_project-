name: Build Kernel

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ==============================
    # Set Timezone (Asia/Jakarta)
    # ==============================
    - name: Set Timezone
      run: |
        sudo timedatectl set-timezone Asia/Jakarta
        echo "BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S WIB')" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date '+%Y%m%d')" >> $GITHUB_ENV

    - name: Install build deps
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache flex \
          libssl-dev libelf-dev lld git wget unzip zip

    # ==============================
    # Cache Proton Clang
    # ==============================
    - name: Cache Proton Clang
      uses: actions/cache@v4
      with:
        path: clang
        key: ${{ runner.os }}-proton-clang

    - name: Get Clang
      run: |
        if [ ! -d clang ]; then
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        else
          echo "Using cached Proton Clang"
        fi

    # ==============================
    # Build Kernel
    # ==============================
    - name: Build kernel
      run: |
        chmod +x build.sh
        ./build.sh

    # ==============================
    # Pack AnyKernel ZIP (VALIDATED)
    # ==============================
    - name: Pack kernel zip
      run: |
        OUT=out/arch/arm64/boot
        AK=AnyKernel3

        IMAGE=${OUT}/Image.gz
        DTB=${OUT}/dtb.img
        DTBO=${OUT}/dtbo.img

        # HARD VALIDATION
        [ -f ${IMAGE} ] || { echo "❌ Image.gz missing"; exit 1; }
        [ -f ${DTB} ]   || { echo "❌ dtb.img missing"; exit 1; }

        cp ${IMAGE} ${AK}/Image.gz
        cp ${DTB}   ${AK}/dtb.img
        [ -f ${DTBO} ] && cp ${DTBO} ${AK}/dtbo.img

        ZIP_NAME="${ZIP_NAME:-UranusKernel-${GITHUB_REF_NAME}-${BUILD_DATE}}.zip"
        cd ${AK}
        zip -r9 ../${ZIP_NAME} *
        cd ..

        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

    # ==============================
    # Upload Artifact
    # ==============================
    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-zip
        path: "*.zip"

    # ==============================
    # GitHub Release (TAG ONLY)
    # ==============================
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: "*.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
